<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minhas solicitações — CondoFix</title>
<!-- Bootstrap 5 (aula 14): usado só no componente "card + badge" da lista abaixo -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="css/style.css">
<script src="js/script.js" defer></script>
</head>
<body>
<a class="pular" href="#conteudo">Ir para o conteúdo</a>
<header class="topo">
  <a class="marca" href="inicio.html"><img class="logo-icone" src="img/logo-icone.png" alt="" width="202" height="192"><span>CondoFix</span></a>
  <button type="button" class="botao-menu" id="btnMenu" aria-expanded="false" aria-controls="menu">Menu</button>
  <nav class="menu" id="menu" aria-label="Principal">
    <ul>
      <li><a href="inicio.html">Início</a></li>
      <li><a href="nova-solicitacao.html">Nova solicitação</a></li>
      <li><a href="minhas-solicitacoes.html" aria-current="page">Minhas solicitações</a></li>
      <li><a href="sobre.html">Sobre</a></li>
      <li><a href="index.html">Sair</a></li>
    </ul>
  </nav>
</header>
<main id="conteudo">
  <h1>Minhas solicitações</h1>
  <p><a class="botao" href="nova-solicitacao.html">Nova solicitação</a></p>
  <form class="filtros" role="search" aria-label="Filtrar solicitações">
    <div class="campo">
      <label for="busca">Buscar</label>
      <input id="busca" type="search" placeholder="Ex.: portão">
    </div>
    <div class="campo">
      <label for="filtroStatus">Status</label>
      <select id="filtroStatus">
        <option value="">Todos</option>
        <option>Em análise</option>
        <option>Agendado</option>
        <option>Concluído</option>
      </select>
    </div>
    <div class="campo">
      <label for="ordem">Ordenar</label>
      <select id="ordem">
        <option value="recentes">Mais recentes</option>
        <option value="antigos">Mais antigos</option>
        <option value="titulo">Título (A–Z)</option>
      </select>
    </div>
  </form>
  <p id="contagem" aria-live="polite"></p>
  <!-- Componente com Bootstrap: cada <li> usa card + badge (gerados em js/script.js).
       Equivalente em CSS puro: veja o bloco comentado em css/style.css -->
  <ul class="lista-cards" id="listaMinhas"></ul>
</main>
<footer class="rodape"><p>CondoFix — projeto acadêmico de Análise e Desenvolvimento de Sistemas.</p></footer>
<button type="button" class="botao-tema" id="btnTema" aria-label="Ativar tema escuro" title="Ativar tema escuro">☾</button>
</body>
</html>
